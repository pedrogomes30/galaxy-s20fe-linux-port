# r8q: never get stuck on a black screen
# - chvt 7 can block forever after a failed first start -> start-post timeout
# - OnFailure=getty@tty1 (masked now) conflicts with phosh and stopped it for good
[Unit]
StartLimitIntervalSec=0
[Service]
ExecStartPost=
ExecStartPost=-+/usr/bin/timeout 10 /usr/bin/chvt 7
